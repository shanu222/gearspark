<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GearSpark: Electromechanical Puzzle Game | Wire it. Gear it. Power it.</title>
  <meta name="description" content="GearSpark is a free browser puzzle game where you wire circuits, connect gears, and build motors and generators. Real physics: Ohm's law, gear ratios and energy conversion. 18 levels plus sandbox.">
  <meta property="og:title" content="GearSpark: Wire it. Gear it. Power it.">
  <meta property="og:description" content="Free electromechanical puzzle game with real circuit and gear physics. Play in your browser, no download.">
  <meta name="theme-color" content="#07121f">
  <!--SITE_META-->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/chakra-petch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:24px;font:16px system-ui;color:#eaf2fb">GearSpark needs JavaScript to run. Please enable it and reload.</p></noscript>

<!-- icon sprite -->

    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.7.5 1 1.2 1 2.1h5c0-.9.3-1.6 1-2.1A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div id="splash" class="splash" aria-hidden="true">
  <svg class="splash-logo" viewBox="0 0 64 64"><use href="#logo-mark"/></svg>
  <div class="splash-name">GEAR<span>SPARK</span></div>
  <div class="splash-bar"><i></i></div>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo-mark" viewBox="0 0 64 64"><path fill="#e0ad48" d="M32 4l4.4 6.4 7.6-2.2 1.1 7.7 7.7 1.1-2.2 7.6L57 29l-5.6 5.4 2.2 7.6-7.7 1.1-1.1 7.7-7.6-2.2L32 55l-4.4-6.4-7.6 2.2-1.1-7.7-7.7-1.1 2.2-7.6L7 29l5.6-5.4-2.2-7.6 7.7-1.1 1.1-7.7 7.6 2.2z"/><circle cx="32" cy="29.5" r="13" fill="#07121f"/><path d="M34.5 17l-10 14.5h7.5L28.5 42 39.5 26.5H32z" fill="#ffd25a"/></symbol>
</defs></svg>

<div id="fatal" class="fatal" hidden role="alert"><div><h2>Something went wrong</h2><p>Your saved progress is safe.</p><button class="btn btn-primary" id="btn-reload">Reload game</button></div></div>

<div id="app">
  <!-- TITLE / LEVEL MAP -->
  <section class="screen" id="screen-menu">
    <canvas id="menu-bg" aria-hidden="true"></canvas>
    <div class="menu-wrap">
      <header class="title">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#logo-mark"/></svg>
          <div>
            <h1>GEAR<span>SPARK</span></h1>
            <p class="tag">Wire it. Gear it. Power it.</p>
          </div>
        </div>
        <div class="title-actions">
          <button class="btn-play" id="btn-continue">
            <span class="play-ico"><svg><use href="#i-play"/></svg></span>
            <span class="play-txt"><b id="play-label">Play</b><small id="play-sub">Level 1-1</small></span>
          </button>
          <div class="round-row">
            <button class="icon-btn lg" id="btn-sandbox" title="Sandbox" aria-label="Sandbox"><svg><use href="#i-sandbox"/></svg><span>Sandbox</span></button>
            <button class="icon-btn lg" id="btn-help-menu" title="How to play" aria-label="How to play"><svg><use href="#i-help"/></svg><span>How to play</span></button>
            <button class="icon-btn lg" id="btn-sound-menu" title="Sound" aria-label="Sound"><svg><use href="#i-sound"/></svg><span>Sound</span></button>
          </div>
        </div>
        <div class="star-pill"><svg><use href="#i-star"/></svg><b id="total-stars">0 / 54</b></div>
      </header>
      <div id="worlds" class="worlds"></div>
      <footer class="foot">Real physics · progress saved on this device · Resilience Technologies Labs</footer>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="screen-game" hidden>
    <header class="hud">
      <button class="icon-btn" id="btn-back" title="Levels" aria-label="Back to levels"><svg><use href="#i-back"/></svg></button>
      <div class="lv-chip">
        <span class="lv-badge" id="lv-badge"><svg><use href="#i-bolt"/></svg></span>
        <span class="lv-text"><small id="lv-world"></small><b id="lv-title"></b></span>
      </div>
      <div class="hud-tools">
        <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
        <button class="icon-btn" id="btn-reset" title="Reset level" aria-label="Reset level"><svg><use href="#i-reset"/></svg></button>
        <button class="icon-btn hint" id="btn-hint" title="Hint" aria-label="Hint"><svg><use href="#i-hint"/></svg></button>
        <button class="icon-btn" id="btn-help" title="How to play" aria-label="How to play"><svg><use href="#i-help"/></svg></button>
        <button class="icon-btn" id="btn-sound" title="Sound" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
      </div>
    </header>

    <div class="stage">
      <div class="board-area">
        <div class="board-top">
          <ul id="goals" class="goal-chips" aria-label="Goals"></ul>
          <div id="par" class="par-meter"></div>
        </div>
        <div id="board-wrap" class="board-wrap">
          <canvas id="board"></canvas>
          <div id="intro" class="briefing" hidden><svg><use href="#i-bolt"/></svg><span id="intro-text"></span><button id="intro-close" aria-label="Dismiss"><svg><use href="#i-close"/></svg></button></div>
          <div id="status" class="alerts" aria-live="polite"></div>
          <div id="toast" class="toast" role="status"></div>
        </div>
      </div>
      <aside class="side">
        <div class="panel meter-panel"><div id="meter" class="meter"></div></div>
        <details class="panel concept-panel" id="concept-panel">
          <summary><svg><use href="#i-book"/></svg><span>Engineering concept</span></summary>
          <div id="concept"></div>
        </details>
      </aside>
    </div>
    <div class="dock-wrap"><div id="inventory" class="dock" aria-label="Parts"></div></div>
  </section>

  <div id="modal" class="modal" hidden><div id="modal-body" class="modal-body"></div></div>
</div>
<script src="js/boot.js"></script>
<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
